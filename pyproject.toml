[project]
name = "walking-leap"
version = "0.1.0"
description = "Emergent finger locomotion for the LEAP Hand V1 with mjlab."
readme = "README.md"
license = "MIT"
license-files = [
  "LICENSE",
  "src/walking_leap/assets/leap_hand/LICENSE",
  "src/walking_leap/assets/parts/LICENSE",
]
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab==1.6.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

# mjlab discovers external tasks through this entry point on import.
[project.entry-points."mjlab.tasks"]
walking_leap = "walking_leap"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
]

[tool.uv]
# rsl-rl-lib 5.4.2 (pinned by mjlab 1.6.1) calls
# wandb.Settings(start_method="thread"), which wandb >= 0.29 rejects.
constraint-dependencies = ["wandb<0.29"]

[tool.ruff]
indent-width = 2
src = ["src"]
# CMU's LEAP_Hand_API, kept byte for byte (real/leap_hand/third_party/README.md).
extend-exclude = ["real/leap_hand/third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA device (skipped automatically when none is available)",
]
addopts = "--strict-markers"
